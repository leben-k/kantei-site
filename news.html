<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お知らせ｜筆跡指紋鑑定</title>
<meta name="description" content="筆跡指紋鑑定からの最新のお知らせをご案内しています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4D0; --paper-light:#F8F3E7; --ink:#211E1A;
    --seal:#B7282E; --navy:#33465C; --muted:#6B6355; --line: rgba(33,30,26,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP", sans-serif; line-height:1.9;}
  h1,h2{font-family:"Shippori Mincho", serif; font-weight:700; margin:0;}
  .mono{font-family:"JetBrains Mono", monospace;}
  a{color:var(--seal);}
  header{position:sticky; top:0; z-index:50; background:rgba(237,228,208,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:800px; margin:0 auto;}
  .brand-mark{font-size:18px; font-weight:800; font-family:"Shippori Mincho",serif; text-decoration:none; color:var(--ink); line-height:1.3;}
  .back-link{font-size:13px; font-family:"JetBrains Mono",monospace; text-decoration:none; color:var(--navy); flex-shrink:0; margin-left:16px;}
  .wrap{max-width:640px; margin:0 auto; padding:64px 24px 100px;}
  .file-tag{font-size:12px; color:var(--muted); font-family:"JetBrains Mono",monospace; border:1px solid var(--line); padding:5px 12px; border-radius:2px; display:inline-block; margin-bottom:24px;}
  h1{font-size:clamp(24px,4vw,34px); margin-bottom:12px;}
  .lead{font-size:13px; color:var(--muted); margin-bottom:40px;}
  .load-note{font-size:13px; color:var(--muted); text-align:center; padding:40px 0;}

  .news-list{list-style:none; margin:0; padding:0;}
  .news-item{
    padding:26px 0; border-bottom:1px solid var(--line);
  }
  .news-date{
    font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--seal);
    display:block; margin-bottom:8px;
  }
  .news-title{
    font-family:"Shippori Mincho",serif; font-weight:700; font-size:16px;
    margin:0 0 8px;
  }
  .news-body{
    font-size:14px; color:var(--ink); white-space:pre-wrap; margin:0;
  }
  .empty-note{font-size:14px; color:var(--muted); padding:20px 0;}

  .to-top{
    display:block; text-align:center; padding:20px 24px;
    font-size:13px; font-family:"JetBrains Mono",monospace;
    color:var(--navy); text-decoration:none; border-top:1px solid var(--line);
  }
  .to-top:hover{color:var(--seal);}
  footer{border-top:1px solid var(--line); padding:32px 24px; font-size:12px; color:var(--muted); text-align:center;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand-mark" href="index.html">筆跡指紋鑑定</a>
    <a class="back-link" href="index.html">&lt; トップに戻る</a>
  </div>
</header>

<div class="wrap">
  <span class="file-tag mono">NEWS</span>
  <h1>お知らせ</h1>
  <p class="lead">最新のお知らせを掲載しています。</p>

  <ul class="news-list" id="newsList"></ul>
</div>

<a class="to-top" href="index.html">▲ トップページへ戻る</a>

<footer>
  © 2026 <a href="index.html" style="color:inherit; text-decoration:underline;">筆跡指紋鑑定</a>
  　／　<a href="index.html#contact" style="color:var(--seal); text-decoration:underline;">無料相談はこちら</a>
</footer>

<script>
  // ↓ 公開したGoogleスプレッドシートのCSV URLを、ここに1回だけ貼り付けてください
  const SHEET_CSV_URL = "GOOGLE_SHEET_CSV_URL_HERE";

  const newsList = document.getElementById('newsList');

  // カンマ・改行を含むセルにも対応した簡易CSVパーサー
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i=0; i<text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ''));
  }

  function fmtJP(iso){
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return iso;
    return `${m[1]}年${Number(m[2])}月${Number(m[3])}日`;
  }

  async function loadNews(){
    if(!SHEET_CSV_URL || SHEET_CSV_URL.includes('GOOGLE_SHEET_CSV_URL_HERE')){
      newsList.innerHTML = '<li class="empty-note">お知らせデータの取得先が未設定です。</li>';
      return;
    }
    try{
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store', signal:controller.signal});
      clearTimeout(timeout);
      const text = await res.text();
      let rows = parseCSV(text);

      // 先頭行が見出し（date,title,body等）であれば除外
      if(rows.length && /date|日付|title|タイトル/i.test(rows[0].join(''))){
        rows = rows.slice(1);
      }

      const items = rows
        .map(r => ({ date: (r[0]||'').trim(), title: (r[1]||'').trim(), body: (r[2]||'').trim() }))
        .filter(item => /^\d{4}-\d{2}-\d{2}/.test(item.date) && item.title)
        .sort((a,b) => b.date.localeCompare(a.date));

      if(items.length === 0){
        newsList.innerHTML = '<li class="empty-note">現在、お知らせはございません。</li>';
        return;
      }

      newsList.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'news-item';
        const dateEl = document.createElement('span');
        dateEl.className = 'news-date';
        dateEl.textContent = fmtJP(item.date);
        const titleEl = document.createElement('p');
        titleEl.className = 'news-title';
        titleEl.textContent = item.title;
        li.appendChild(dateEl);
        li.appendChild(titleEl);
        if(item.body){
          const bodyEl = document.createElement('p');
          bodyEl.className = 'news-body';
          bodyEl.textContent = item.body;
          li.appendChild(bodyEl);
        }
        newsList.appendChild(li);
      });
    }catch(e){
      console.error('お知らせの取得に失敗しました', e);
      newsList.innerHTML = '<li class="empty-note">お知らせの読み込みに失敗しました（通信環境をご確認ください）。</li>';
    }
  }

  loadNews();
</script>

</body>
</html>
