<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休業日カレンダー設定ツール（管理者専用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4D0; --paper-light:#F8F3E7; --ink:#211E1A;
    --seal:#B7282E; --navy:#33465C; --muted:#6B6355; --line: rgba(33,30,26,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP",sans-serif; line-height:1.8;}
  .wrap{max-width:520px; margin:0 auto; padding:40px 20px 80px;}
  h1{font-family:"Shippori Mincho",serif; font-size:22px; margin-bottom:8px;}
  .desc{font-size:13px; color:var(--muted); margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--line);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head button{
    background:none; border:1px solid var(--line); border-radius:2px;
    padding:8px 14px; font-size:14px; cursor:pointer; color:var(--ink);
  }
  .cal-title{font-family:"JetBrains Mono",monospace; font-size:15px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:24px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--muted); padding:6px 0; font-family:"JetBrains Mono",monospace;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:2px; background:var(--paper-light);
    font-size:13px; cursor:pointer; user-select:none; background-clip:padding-box;
  }
  .cal-day.empty{border:none; background:none; cursor:default;}
  .cal-day.weekend{color:var(--muted);}
  .cal-day.closed{background:var(--seal); color:#fff; border-color:var(--seal); font-weight:700;}
  .cal-day.fixed{cursor:not-allowed; opacity:0.85;}
  .cal-day.past{opacity:0.35; cursor:not-allowed;}
  .output-label{font-size:12px; color:var(--muted); font-family:"JetBrains Mono",monospace; margin-bottom:8px; display:block;}
  textarea{
    width:100%; min-height:90px; border:1px solid var(--line); background:#fff;
    padding:12px; font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink);
    border-radius:2px; resize:vertical;
  }
  .copy-btn{
    margin-top:10px; background:var(--seal); color:#fff; border:none;
    padding:12px 28px; border-radius:2px; font-size:13px; cursor:pointer;
  }
  .copy-btn.copied{background:var(--navy);}
  .list-box{margin-top:28px;}
  .list-box h2{font-size:13px; font-family:"Noto Sans JP",sans-serif; color:var(--muted); margin-bottom:10px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper-light);
    border:1px solid var(--line); border-radius:2px; padding:6px 10px; font-size:12px;
    margin:0 6px 6px 0;
  }
  .chip button{border:none; background:none; color:var(--seal); cursor:pointer; font-size:13px; padding:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>休業日カレンダー設定ツール</h1>
  <p class="desc">土曜・日曜・祝日は自動的に休業日として表示されます（クリック不可）。平日に臨時で休業する日だけ、カレンダーからクリックして選んでください（もう一度クリックで解除）。選び終わったら、下に表示されるコードをコピーし、calendar.htmlの該当箇所に貼り付けて保存してください。このページ自体は自分専用のツールなので、サイトの案内には載せなくて大丈夫です。</p>

  <div class="cal-head">
    <button id="prevBtn">‹ 前の月</button>
    <span class="cal-title" id="calTitle"></span>
    <button id="nextBtn">次の月 ›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <span class="output-label">↓ このコードをコピーして about.html に貼り付けてください</span>
  <textarea id="output" readonly></textarea>
  <button class="copy-btn" id="copyBtn">コードをコピー</button>

  <div class="list-box">
    <h2>選択中の休業日（一覧・ここからも解除できます）</h2>
    <div id="chipList"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'closedDates';
  let closedDates = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  let viewYear, viewMonth;
  const today = new Date();
  today.setHours(0,0,0,0);
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();

  // 日本の祝日を計算（固定日＋第n月曜日＋春分・秋分の日の概算＋振替休日）
  function nthMonday(year, month, n){
    const first = new Date(year, month-1, 1);
    const firstMon = 1 + ((8 - first.getDay()) % 7);
    return firstMon + (n-1)*7;
  }
  function getJPHolidays(year){
    const h = new Map();
    const add = (m,d,name) => h.set(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, name);
    add(1,1,'元日');
    add(1, nthMonday(year,1,2), '成人の日');
    add(2,11,'建国記念の日');
    add(2,23,'天皇誕生日');
    add(3, Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), '春分の日');
    add(4,29,'昭和の日');
    add(5,3,'憲法記念日');
    add(5,4,'みどりの日');
    add(5,5,'こどもの日');
    add(7, nthMonday(year,7,3), '海の日');
    add(8,11,'山の日');
    add(9, nthMonday(year,9,3), '敬老の日');
    add(9, Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), '秋分の日');
    add(10, nthMonday(year,10,2), 'スポーツの日');
    add(11,3,'文化の日');
    add(11,23,'勤労感謝の日');
    [...h.keys()].forEach(iso => {
      const d = new Date(iso);
      if(d.getDay() === 0){
        let next = new Date(d);
        do{ next.setDate(next.getDate()+1); } while(h.has(fmt(next.getFullYear(),next.getMonth(),next.getDate())));
        h.set(fmt(next.getFullYear(),next.getMonth(),next.getDate()), '振替休日');
      }
    });
    return h;
  }
  function isFixedClosed(y, m, d){
    const iso = fmt(y, m, d);
    const wd = new Date(y, m, d).getDay();
    if(wd === 0 || wd === 6) return true;
    if(getJPHolidays(y).has(iso)) return true;
    return false;
  }

  const calTitle = document.getElementById('calTitle');
  const calGrid = document.getElementById('calGrid');
  const output = document.getElementById('output');
  const chipList = document.getElementById('chipList');
  const dow = ['日','月','火','水','木','金','土'];

  function fmt(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function fmtJP(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return `${y}年${m}月${d}日`;
  }

  function render(){
    calTitle.textContent = `${viewYear}年 ${viewMonth+1}月`;
    calGrid.innerHTML = '';
    dow.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    for(let i=0;i<firstDay;i++){
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      calGrid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el = document.createElement('div');
      const iso = fmt(viewYear, viewMonth, d);
      const thisDate = new Date(viewYear, viewMonth, d);
      const wd = thisDate.getDay();
      const fixed = isFixedClosed(viewYear, viewMonth, d);
      el.className = 'cal-day';
      if(wd===0 || wd===6) el.classList.add('weekend');
      if(thisDate < today) el.classList.add('past');
      if(fixed) el.classList.add('fixed');
      if(fixed || closedDates.has(iso)) el.classList.add('closed');
      el.textContent = d;
      el.addEventListener('click', () => {
        if(thisDate < today) return;
        if(fixed) return;
        if(closedDates.has(iso)) closedDates.delete(iso);
        else closedDates.add(iso);
        save();
        render();
      });
      calGrid.appendChild(el);
    }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...closedDates]));
    updateOutput();
  }

  function updateOutput(){
    const sorted = [...closedDates].sort();
    output.value = `const CLOSED_DATES = ${JSON.stringify(sorted)};`;
    chipList.innerHTML = '';
    if(sorted.length === 0){
      chipList.innerHTML = '<span style="font-size:12px; color:var(--muted);">現在、休業日は選択されていません。</span>';
      return;
    }
    sorted.forEach(iso => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${fmtJP(iso)} <button data-iso="${iso}">×</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        closedDates.delete(iso);
        save();
        render();
      });
      chipList.appendChild(chip);
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    render();
  });
  document.getElementById('copyBtn').addEventListener('click', () => {
    output.select();
    document.execCommand('copy');
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'コピーしました';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = 'コードをコピー'; btn.classList.remove('copied'); }, 1800);
  });

  render();
  updateOutput();
</script>
</body>
</html>
