<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業カレンダー｜筆跡指紋鑑定</title>
<meta name="description" content="筆跡指紋鑑定の営業カレンダーです。臨時休業日を随時更新してご案内しています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4D0; --paper-light:#F8F3E7; --ink:#211E1A;
    --seal:#B7282E; --navy:#33465C; --muted:#6B6355; --line: rgba(33,30,26,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP", sans-serif; line-height:1.9;}
  h1,h2{font-family:"Shippori Mincho", serif; font-weight:700; margin:0;}
  .mono{font-family:"JetBrains Mono", monospace;}
  a{color:var(--seal);}
  header{position:sticky; top:0; z-index:50; background:rgba(237,228,208,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:800px; margin:0 auto;}
  .brand-mark{font-size:16px; font-weight:800; font-family:"Shippori Mincho",serif; text-decoration:none; color:var(--ink); line-height:1.3;}
  @media (min-width:480px){ .brand-mark{font-size:20px;} }
  .back-link{font-size:13px; font-family:"JetBrains Mono",monospace; text-decoration:none; color:var(--navy); flex-shrink:0; margin-left:16px;}
  .wrap{max-width:600px; margin:0 auto; padding:64px 24px 100px;}
  .file-tag{font-size:12px; color:var(--muted); font-family:"JetBrains Mono",monospace; border:1px solid var(--line); padding:5px 12px; border-radius:2px; display:inline-block; margin-bottom:24px;}
  h1{font-size:clamp(24px,4vw,34px); margin-bottom:12px;}
  .lead{font-size:13px; color:var(--muted); margin-bottom:40px;}

  .cal-head{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px;}
  .cal-head button{
    background:none; border:1px solid var(--line); border-radius:2px;
    padding:7px 14px; font-size:13px; cursor:pointer; color:var(--ink);
    font-family:"Noto Sans JP",sans-serif;
  }
  .cal-head button:hover{border-color:var(--seal); color:var(--seal);}
  .cal-title{font-family:"JetBrains Mono",monospace; font-size:14px; color:var(--muted); min-width:110px; text-align:center;}
  .load-note{font-size:12px; color:var(--muted); text-align:center; margin-bottom:10px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:20px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--muted); padding:4px 0; font-family:"JetBrains Mono",monospace;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:2px; background:var(--paper-light); font-size:12px;
  }
  .cal-day.empty{border:none; background:none;}
  .cal-day.weekend{color:var(--muted);}
  .cal-day.closed{background:var(--seal); color:#fff; font-weight:700; border-color:var(--seal);}
  .cal-day.today{outline:2px solid var(--navy); outline-offset:-2px;}
  .legend{display:flex; gap:18px; font-size:12px; color:var(--muted); margin-bottom:8px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend .sw{width:12px; height:12px; border-radius:2px; display:inline-block;}
  .closure-list{list-style:none; padding:0; margin:16px 0 0; font-size:13px;}
  .closure-list li{padding:8px 0; border-bottom:1px solid var(--line);}
  .closure-list .empty-note{color:var(--muted); font-size:13px;}

  .to-top{
    display:block; text-align:center; padding:20px 24px;
    font-size:13px; font-family:"JetBrains Mono",monospace;
    color:var(--navy); text-decoration:none; border-top:1px solid var(--line);
  }
  .to-top:hover{color:var(--seal);}
  footer{border-top:1px solid var(--line); padding:32px 24px; font-size:12px; color:var(--muted); text-align:center;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand-mark" href="index.html">筆跡指紋鑑定</a>
    <a class="back-link" href="index.html">&lt; トップに戻る</a>
  </div>
</header>

<div class="wrap">
  <span class="file-tag mono">CALENDAR</span>
  <h1>営業カレンダー</h1>
  <p class="lead">平日を営業日としております。休業日（臨時休業日含む）は赤色で表示しています。</p>

  <div class="legend">
    <span><span class="sw" style="background:var(--seal);"></span>休業日</span>
    <span><span class="sw" style="background:var(--paper-light); border:1px solid var(--line);"></span>営業日</span>
  </div>

  <div class="cal-head">
    <button id="prevBtn">‹ 前の月</button>
    <span class="cal-title" id="calTitle"></span>
    <button id="nextBtn">次の月 ›</button>
  </div>
  <p class="load-note" id="loadNote"></p>
  <div class="cal-grid" id="calGrid"></div>

  <h3 style="font-size:14px; margin:24px 0 4px;">直近の臨時休業日</h3>
  <ul class="closure-list" id="closureList"></ul>
</div>

<a class="to-top" href="index.html">▲ トップページへ戻る</a>

<footer>
  © 2026 <a href="index.html" style="color:inherit; text-decoration:underline;">筆跡指紋鑑定</a>
  　／　<a href="index.html#contact" style="color:var(--seal); text-decoration:underline;">無料相談はこちら</a>
</footer>

<script>
  // ↓ 公開したGoogleスプレッドシートのCSV URLを、ここに1回だけ貼り付けてください
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1FqDmCnwsk9LtBSeEq23Ik2RXYaLVTuufN5x1AvD4SpOU4lxKY1im1EFjwnNhcQgoFo5z_9gEoDNt/pub?gid=0&single=true&output=csv";

  let CLOSED_DATES = [];

  async function loadClosedDates(){
    const loadNote = document.getElementById('loadNote');
    if(!SHEET_CSV_URL || SHEET_CSV_URL.includes('GOOGLE_SHEET_CSV_URL_HERE')){
      loadNote.textContent = '※ スプレッドシート未設定のため、臨時休業日は表示されません（土日祝は表示されます）';
      return [];
    }
    try{
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store', signal:controller.signal});
      clearTimeout(timeout);
      const text = await res.text();
      const dates = text.trim().split('\n')
        .map(line => line.split(',')[0].replace(/"/g,'').trim())
        .filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v));
      loadNote.textContent = '';
      return dates;
    }catch(e){
      console.error('休業日データの取得に失敗しました', e);
      loadNote.textContent = '※ 臨時休業日の読み込みに失敗しました（通信環境をご確認ください）';
      return [];
    }
  }

  // 日本の祝日を計算（固定日＋第n月曜日＋春分・秋分の日の概算＋振替休日）
  function nthMonday(year, month, n){
    const first = new Date(year, month-1, 1);
    const firstMon = 1 + ((8 - first.getDay()) % 7);
    return firstMon + (n-1)*7;
  }
  function getJPHolidays(year){
    const h = new Map();
    const add = (m,d,name) => h.set(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, name);
    add(1,1,'元日');
    add(1, nthMonday(year,1,2), '成人の日');
    add(2,11,'建国記念の日');
    add(2,23,'天皇誕生日');
    add(3, Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), '春分の日');
    add(4,29,'昭和の日');
    add(5,3,'憲法記念日');
    add(5,4,'みどりの日');
    add(5,5,'こどもの日');
    add(7, nthMonday(year,7,3), '海の日');
    add(8,11,'山の日');
    add(9, nthMonday(year,9,3), '敬老の日');
    add(9, Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), '秋分の日');
    add(10, nthMonday(year,10,2), 'スポーツの日');
    add(11,3,'文化の日');
    add(11,23,'勤労感謝の日');
    // 振替休日（日曜と重なる祝日の翌平日）
    [...h.keys()].forEach(iso => {
      const d = new Date(iso);
      if(d.getDay() === 0){
        let next = new Date(d);
        do{ next.setDate(next.getDate()+1); } while(h.has(fmt(next.getFullYear(),next.getMonth(),next.getDate())));
        h.set(fmt(next.getFullYear(),next.getMonth(),next.getDate()), '振替休日');
      }
    });
    return h;
  }

  const today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  const dow = ['日','月','火','水','木','金','土'];
  const calTitle = document.getElementById('calTitle');
  const calGrid = document.getElementById('calGrid');
  const closureList = document.getElementById('closureList');

  function fmt(y,m,d){ return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  function fmtJP(iso){ const [y,m,d] = iso.split('-').map(Number); return `${y}年${m}月${d}日`; }

  function isClosedDay(y, m, d){
    const iso = fmt(y, m, d);
    const wd = new Date(y, m, d).getDay();
    const holidays = getJPHolidays(y);
    if(wd === 0 || wd === 6) return true;
    if(holidays.has(iso)) return true;
    if(CLOSED_DATES.includes(iso)) return true;
    return false;
  }

  function renderCalendar(){
    calTitle.textContent = `${viewYear}年 ${viewMonth+1}月`;
    calGrid.innerHTML = '';
    dow.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    for(let i=0;i<firstDay;i++){
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      calGrid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el = document.createElement('div');
      const iso = fmt(viewYear, viewMonth, d);
      const wd = new Date(viewYear, viewMonth, d).getDay();
      el.className = 'cal-day';
      if(wd===0 || wd===6) el.classList.add('weekend');
      if(isClosedDay(viewYear, viewMonth, d)) el.classList.add('closed');
      if(iso === fmt(today.getFullYear(), today.getMonth(), today.getDate())) el.classList.add('today');
      el.textContent = d;
      calGrid.appendChild(el);
    }
  }

  function renderClosureList(){
    const holidaysThis = getJPHolidays(today.getFullYear());
    const holidaysNext = getJPHolidays(today.getFullYear()+1);
    const allHolidayEntries = [...holidaysThis.entries(), ...holidaysNext.entries()];
    const combined = [
      ...CLOSED_DATES.map(iso => ({iso, label:'臨時休業'})),
      ...allHolidayEntries.map(([iso,name]) => ({iso, label:name})),
    ];
    const upcoming = combined
      .filter(item => new Date(item.iso) >= today)
      .sort((a,b) => a.iso.localeCompare(b.iso))
      .slice(0, 8);
    closureList.innerHTML = '';
    if(upcoming.length === 0){
      closureList.innerHTML = '<li class="empty-note">現在、予定されている休業日はございません。</li>';
      return;
    }
    upcoming.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${fmtJP(item.iso)}（${item.label}）`;
      closureList.appendChild(li);
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    renderCalendar();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    renderCalendar();
  });

  // まず土日・祝日だけで即座にカレンダーを表示
  renderCalendar();
  renderClosureList();

  // 臨時休業日データは通信完了後に反映（表示をブロックしない）
  (async function loadAndRefresh(){
    CLOSED_DATES = await loadClosedDates();
    renderCalendar();
    renderClosureList();
  })();
</script>

</body>
</html>
